name: Keep Streamlit Alive

on:
  schedule:
    # A cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          echo "=== Ping 1/3: página principal ==="
          curl -s -L -o /dev/null -w "Status: %{http_code} | Tempo: %{time_total}s | URL final: %{url_effective}\n" \
            https://gerador-bac-bo-steyc7b62upmtekbanb652.streamlit.app
          
          sleep 5
          
          echo "=== Ping 2/3: health endpoint ==="
          curl -s -L -o /dev/null -w "Status: %{http_code}\n" \
            https://gerador-bac-bo-steyc7b62upmtekbanb652.streamlit.app/~/+/healthz
          
          sleep 5
          
          echo "=== Ping 3/3: recarregando principal ==="
          curl -s -L -o /dev/null -w "Status: %{http_code} | Tempo: %{time_total}s\n" \
            https://gerador-bac-bo-steyc7b62upmtekbanb652.streamlit.app
          
          echo "✅ Ping concluído em $(date -u)"